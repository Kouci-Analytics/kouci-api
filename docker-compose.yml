services:
  postgres:
    image: postgres:18-alpine
    container_name: kouci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kouci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
